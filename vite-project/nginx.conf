server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cho phép request lớn đi qua Nginx để Backend (multer) tự kiểm tra giới hạn 10 MB
    # và trả đúng JSON lỗi 413 theo đặc tả PRD (API08).
    client_max_body_size 50M;

    # Chuyển tiếp các API request sang container backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chuyển tiếp file âm thanh tĩnh (/uploads/audio/*.mp3) sang container backend
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hỗ trợ điều hướng SPA (React Router: /admin, /tour, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

