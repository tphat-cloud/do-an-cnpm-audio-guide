# Docker Compose - Chạy MySQL 8.0 cho đồ án
# Lệnh chạy: docker compose up -d
# Lệnh tắt:  docker compose down

# Pin tên project để không phụ thuộc tên thư mục chứa file này
# (mỗi người clone vào folder tên khác nhau vẫn dùng chung một bộ tài nguyên,
#  và tránh lỗi "container name is already in use" khi đổi chỗ đặt repo).
# Giữ đúng tên "doancnpm" mà volume dữ liệu đang mang (volume của compose
#  có tiền tố = tên project → đổi tên project sẽ sinh volume RỖNG khác).
name: doancnpm

services:
  # === MySQL Database ===
  mysql:
    image: mysql:8.0
    container_name: doan-mysql
    restart: always
    ports:
      - "3306:3306"           # Truy cập MySQL qua localhost:3306
    environment:
      MYSQL_ROOT_PASSWORD: root123        # Mật khẩu root
      MYSQL_DATABASE: narration_db        # Tên database tự tạo sẵn
      MYSQL_USER: doan_user               # User cho ứng dụng
      MYSQL_PASSWORD: doan_pass123        # Mật khẩu user
    volumes:
      - mysql_data:/var/lib/mysql         # Lưu data, không mất khi tắt container
      # Chỉ chạy 1 lần khi volume MySQL còn trống: tạo 4 bảng + dữ liệu mẫu
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # === Backend API (Express + TypeScript) ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doan-backend
    restart: always
    ports:
      - "5000:5000"           # Truy cập API trực tiếp qua localhost:5000 (GET /api/health)
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DB_HOST: mysql          # Kết nối tới container mysql qua mạng nội bộ Docker
      DB_PORT: 3306
      DB_USER: ${DB_USER:-doan_user}
      DB_PASSWORD: ${DB_PASSWORD:-doan_pass123}
      DB_NAME: ${DB_NAME:-narration_db}
      JWT_SECRET: ${JWT_SECRET:-doi_thanh_chuoi_ngau_nhien_toi_thieu_32_ky_tu}
    volumes:
      # Gắn volume lưu file audio (/uploads/audio) để không mất file khi khởi động lại container (PRD 4.5.3)
      - ./backend/uploads/audio:/app/uploads/audio
    depends_on:
      mysql:
        condition: service_healthy

  # === Frontend Web Client & Admin Dashboard (React + Vite + Nginx) ===
  frontend:
    build:
      context: ./vite-project
      dockerfile: Dockerfile
    container_name: doan-frontend
    restart: always
    ports:
      - "5173:80"             # Mở Web tại http://localhost:5173
    depends_on:
      - backend

# Không đưa phpMyAdmin vào compose: mỗi người dùng client CSDL riêng (DBeaver...)
# kết nối localhost:3306, đỡ chiếm port và nhẹ máy khi chạy demo.

# Volumes giữ data khi container bị xóa
volumes:
  mysql_data:
