# Docker Compose - Chạy các service của đồ án
# Tạo .env từ .env.example, điền các secret rồi chạy: docker compose up -d --build
# Lệnh tắt: docker compose down

# Giữ nguyên project name để giữ volume database đang tồn tại.
name: doancnpm

services:
  mysql:
    image: mysql:8.0
    container_name: doan-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-narration_db}
      MYSQL_USER: ${DB_USER:-doan_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    image: ghcr.io/tphat-cloud/do-an-cnpm-audio-guide-auth-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: doan-auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-doan_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-narration_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  content-service:
    image: ghcr.io/tphat-cloud/do-an-cnpm-audio-guide-content-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/content-service
      dockerfile: Dockerfile
    container_name: doan-content-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-doan_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-narration_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - ./backend/content-service/uploads/audio:/app/uploads/audio
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-gateway:
    image: ghcr.io/tphat-cloud/do-an-cnpm-audio-guide-api-gateway:${IMAGE_TAG:-latest}
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: doan-api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      AUTH_SERVICE_URL: http://auth-service:3001
      CONTENT_SERVICE_URL: http://content-service:3002
    depends_on:
      auth-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      default:
        aliases:
          # vite-project/nginx.conf retains its existing `backend:5000` upstream.
          - backend

  frontend:
    image: ghcr.io/tphat-cloud/do-an-cnpm-audio-guide-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./vite-project
      dockerfile: Dockerfile
    container_name: doan-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mysql_data:
