name: CI Pipeline

# Quy trình CI theo PRD 4.5.1: chạy mỗi khi đẩy code hoặc tạo Pull Request
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Type-check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 1. Lấy mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/auth-service/package-lock.json
            backend/content-service/package-lock.json
            backend/api-gateway/package-lock.json
            vite-project/package-lock.json

      - name: 1b. Cài thư viện cho từng service và frontend
        run: |
          npm --prefix backend/auth-service ci
          npm --prefix backend/content-service ci
          npm --prefix backend/api-gateway ci
          npm --prefix vite-project ci

      - name: 2. Lint frontend
        run: npm --prefix vite-project run lint

      - name: 3. Type-check từng service và frontend
        run: |
          npm --prefix backend/auth-service run typecheck
          npm --prefix backend/content-service run typecheck
          npm --prefix backend/api-gateway run typecheck
          npx --prefix vite-project tsc -b vite-project/tsconfig.json

      - name: 4. Chạy test từng service
        run: |
          npm --prefix backend/auth-service test
          npm --prefix backend/content-service test
          npm --prefix backend/api-gateway test

      - name: 5. Build từng service và frontend
        run: |
          npm --prefix backend/auth-service run build
          npm --prefix backend/content-service run build
          npm --prefix backend/api-gateway run build
          npm --prefix vite-project run build

      - name: 6. Build Docker images (không push hoặc deploy)
        run: |
          docker build --file backend/auth-service/Dockerfile --tag doancnpm/auth-service:ci backend/auth-service
          docker build --file backend/content-service/Dockerfile --tag doancnpm/content-service:ci backend/content-service
          docker build --file backend/api-gateway/Dockerfile --tag doancnpm/api-gateway:ci backend/api-gateway

  publish-images:
    name: Publish ${{ matrix.image }} image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: auth-service
            context: backend/auth-service
          - image: content-service
            context: backend/content-service
          - image: api-gateway
            context: backend/api-gateway
          - image: frontend
            context: vite-project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:sha-${{ github.sha }}
